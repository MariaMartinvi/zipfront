services:
  - type: web
    name: zip-extractor-pwa
    env: node
    # Build unificado: CRA + blog Astro → site-dist. Servir site-dist para que /blog devuelva HTML estático.
    buildCommand: npm install --legacy-peer-deps && npm run build:site
    startCommand: npm run start:prod
    healthCheckPath: /
    staticPublishPath: site-dist
    routes:
      # Con barra final Render sirve blog/index.html; sin ella aplica el rewrite y devuelve CRA (3 cabeceras)
      - type: redirect
        source: /blog
        destination: /blog/
      - type: redirect
        source: /en/blog
        destination: /en/blog/
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    headers:
      - path: /*
        name: Cache-Control
        value: max-age=31536000
      - path: /service-worker.js
        name: Cache-Control
        value: max-age=0
      - path: /service-worker.js
        name: Content-Type
        value: application/javascript
      - path: /manifest.json
        name: Content-Type
        value: application/manifest+json
      - path: /index.html
        name: Cache-Control
        value: no-cache

  - type: web
    name: zip-extractor-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: SECRET_KEY
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        value: https://chatsalsa.openai.azure.com/
      - key: AZURE_OPENAI_DEPLOYMENT
        value: chatsalsa